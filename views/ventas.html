<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas · Río Vivo POS</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="barra">
    <span class="marca"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 9c3-3 6 3 9 0s6 3 9 0M3 15c3-3 6 3 9 0s6 3 9 0"/></svg> Río Vivo · Ventas</span>
    <nav class="pestanas" role="tablist">
      <button role="tab" data-vista="nueva">Nueva venta</button>
      <button role="tab" data-vista="hoy">Ventas de hoy</button>
    </nav>
    <div class="der">
      <a href="/admin" id="ir-admin" hidden>Administración</a>
      <span id="yo"></span>
      <button class="enlace" id="salir">Salir</button>
    </div>
  </header>

  <main>
    <section id="vista-nueva" class="venta">
      <div>
        <input type="search" id="buscar" placeholder="Buscar producto o servicio" aria-label="Buscar producto o servicio" style="margin:0">
        <div class="chips" id="categorias"></div>
        <div class="productos" id="productos"></div>
      </div>

      <aside class="panel carrito" aria-label="Venta en curso">
        <div class="cabecera" style="margin-bottom:4px">
          <h2>Venta en curso</h2>
          <button type="button" class="texto-btn" id="vaciar" hidden>Vaciar</button>
        </div>
        <div id="lineas"></div>
        <div class="fila" style="margin-top:14px">
          <label>Descuento
            <input type="number" id="descuento" min="0" step="1" inputmode="numeric" placeholder="0">
          </label>
          <label class="fijo">Tipo
            <select id="tipo-descuento" style="width:90px">
              <option value="pesos">$</option>
              <option value="porcentaje">%</option>
            </select>
          </label>
        </div>
        <div class="totales">
          <div><span>Subtotal</span><span class="num" id="subtotal"></span></div>
          <div><span>Descuento</span><span class="num" id="valor-descuento"></span></div>
          <div class="total"><span>Total</span><span class="num" id="total"></span></div>
        </div>
        <label id="lbl-metodo">Método de pago</label>
        <div class="segmento" id="metodos" role="group" aria-labelledby="lbl-metodo">
          <button type="button" data-metodo="EFECTIVO">Efectivo</button>
          <button type="button" data-metodo="TARJETA">Tarjeta</button>
          <button type="button" data-metodo="TRANSFERENCIA">Transferencia</button>
        </div>
        <button class="btn primario grande" id="cobrar">Registrar venta</button>
      </aside>
    </section>

    <section id="vista-hoy" hidden>
      <div class="cabecera">
        <h2 id="titulo-hoy">Ventas de hoy</h2>
        <button class="btn mini" id="recargar">Actualizar</button>
      </div>
      <div class="kpis">
        <div class="kpi"><span>Total vendido</span><b id="hoy-total"></b></div>
        <div class="kpi"><span>Ventas</span><b id="hoy-cantidad"></b></div>
        <div class="kpi"><span>Efectivo</span><b id="hoy-EFECTIVO"></b></div>
        <div class="kpi"><span>Tarjeta</span><b id="hoy-TARJETA"></b></div>
        <div class="kpi"><span>Transferencia</span><b id="hoy-TRANSFERENCIA"></b></div>
      </div>
      <div class="panel tabla-caja">
        <table>
          <thead><tr><th>N.º</th><th>Hora</th><th>Vendedor</th><th>Detalle</th><th>Pago</th><th class="num">Total</th></tr></thead>
          <tbody id="tabla-hoy"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- En pantallas angostas la venta queda debajo del catálogo: esta barra la mantiene a la vista. -->
  <button type="button" class="barra-movil" id="barra-movil" hidden>
    <span id="movil-resumen"></span><b>Ver venta</b>
  </button>

  <dialog id="dlg-ticket" aria-label="Ticket de venta">
    <div class="ticket" id="ticket"></div>
    <div class="botones">
      <button class="btn" id="imprimir">Imprimir</button>
      <button class="btn primario" id="cerrar-ticket">Listo</button>
    </div>
  </dialog>

  <script src="/static/common.js"></script>
  <script src="/static/ventas.js"></script>
</body>
</html>
