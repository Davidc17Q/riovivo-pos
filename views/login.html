<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Río Vivo POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap">
  <link rel="icon" href="/static/img/loto.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/marca.css">
</head>
<body>
  <div class="login">
    <form id="form" class="panel">
      <div>
        <img class="logo" src="/static/img/logo-riovivo.png" alt="RioVivo Spa">
        <h1>Río Vivo Spa</h1>
        <p class="tenue" style="margin:4px 0 0">Punto de venta</p>
      </div>
      <label>Usuario
        <input type="text" id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label>Contraseña
        <input type="password" id="clave" autocomplete="current-password" required>
      </label>
      <p class="error" id="error" role="alert" hidden></p>
      <button class="btn primario grande" id="entrar">Ingresar</button>
    </form>
  </div>
  <script src="/static/common.js"></script>
  <script>
    $('#form').onsubmit = async (e) => {
      e.preventDefault();
      $('#entrar').disabled = true;
      $('#error').hidden = true;
      try {
        await api('POST', '/api/login', { usuario: $('#usuario').value, clave: $('#clave').value });
        location.href = '/ventas';
      } catch (err) {
        $('#error').textContent = err.message;
        $('#error').hidden = false;
        $('#entrar').disabled = false;
      }
    };
  </script>
</body>
</html>
