# Postgres local para el POS. Puerto 5433 para no chocar con otro Postgres en 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: riovivo_pos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_local
      POSTGRES_DB: riovivo_pos
    ports:
      - "5433:5432"
    volumes:
      - riovivo_pos_data:/var/lib/postgresql/data

volumes:
  riovivo_pos_data:
